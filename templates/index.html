<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FlashCraft - Generate Anki flashcards from various sources">
    <title>FlashCraft</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .tab-content {
            padding: 20px;
            border-left: 1px solid #dee2e6;
            border-right: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
        }

        #progress-container {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #dee2e6;
            transition: all 0.3s ease-in-out;
        }

        .progress {
            height: 25px;
            margin-bottom: 15px;
            transition: opacity 0.2s ease-in-out;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            line-height: 25px;
            background-color: #007bff;
            transition: width 0.3s ease-in-out;
            text-align: center;
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        .progress-text {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }

        .result-message {
            display: none;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            opacity: 0;
            transition: all 0.2s ease-in-out;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .result-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result-message .icon {
            margin-right: 10px;
            font-weight: bold;
        }

        .result-message.success .icon::before {
            content: '✓';
            color: #28a745;
        }

        .result-message.error .icon::before {
            content: '✕';
            color: #dc3545;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚡ FlashCraft</h1>

        <div class="tab-container">
            <button class="tab-button active" onclick="openTab('youtube')">
                <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <title>YouTube Video</title>
                    <path
                        d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0C.488 3.45.029 5.804 0 12c.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0C23.512 20.55 23.971 18.196 24 12c-.029-6.185-.484-8.549-4.385-8.816zM9 16V8l8 4-8 4z" />
                </svg>
                <span>YouTube</span>
            </button>
            <button class="tab-button" onclick="openTab('text')">
                <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <title>Text Document</title>
                    <path
                        d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6zm4-9h4v2h-4v-2zm0 4h4v2h-4v-2z" />
                </svg>
                <span>Text</span>
            </button>
            <button class="tab-button" onclick="openTab('document')">
                <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <title>Upload Document</title>
                    <path
                        d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 15.01l1.41 1.41L11 14.84V19h2v-4.16l1.59 1.59L16 15.01 12.01 11z" />
                </svg>
                <span>Document</span>
            </button>
        </div>

        <div id="youtube" class="tab-content active">
            <form id="youtube-form" action="/process_youtube" method="post">
                <textarea name="youtube_links" placeholder="Paste YouTube links (one per line)"></textarea>
                <button type="submit">Generate Flashcards</button>
            </form>
        </div>

        <div id="text" class="tab-content">
            <form id="text-form" action="/process_text" method="post">
                <textarea name="raw_text" placeholder="Paste your text here"></textarea>
                <div class="form-row">
                    <input type="text" name="deck_name" placeholder="Anki Deck Name">
                    <div class="number-input">
                        <label for="num_questions">Number of Questions:</label>
                        <input type="number" name="num_questions" id="num_questions" min="1" max="100" value="10">
                    </div>
                </div>
                <button type="submit">Generate Flashcards</button>
            </form>
        </div>

        <div id="document" class="tab-content">
            <form id="document-form" action="/process_document" method="post" enctype="multipart/form-data">
                <input type="file" name="document" accept=".epub,.mobi,.pdf">
                <input type="text" name="deck_name" placeholder="Anki Deck Name">
                <button type="submit">Generate Flashcards</button>
            </form>
        </div>

        <div id="progress-container" class="progress-container" style="display: none;">
            <div class="progress">
                <div class="progress-bar" role="progressbar" style="width: 0%">0%</div>
            </div>
            <div class="progress-text"></div>
            <div class="result-message">
                <span class="icon"></span>
                <span class="message-text"></span>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
